[package]
name = "webnn_engine"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
mozbuild = "0.1"
mozilla-central-workspace-hack = { version = "0.1", features = ["webnn_engine"], optional = true }
rustnn = { git = "https://github.com/padenot/rustnn", rev = "e5b201a79655c57d03ab41481b1686dd671a3a83", default-features = false, features = ["burn-cpu-runtime"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rustnn = { git = "https://github.com/padenot/rustnn", rev = "e5b201a79655c57d03ab41481b1686dd671a3a83", default-features = false, features = ["coreml-runtime"] }

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
