[package]
name = "webnn_engine"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
mozbuild = "0.1"
mozilla-central-workspace-hack = { version = "0.1", features = ["webnn_engine"], optional = true }
rustnn = { git = "https://github.com/padenot/rustnn", rev = "de3392d2feedbe4e6f633f057fb29e2e7895f061", default-features = false, features = ["burn-runtime-cpu"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rustnn = { git = "https://github.com/padenot/rustnn", rev = "de3392d2feedbe4e6f633f057fb29e2e7895f061", default-features = false, features = ["coreml-runtime"] }

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
