[package]
name = "webnn_engine"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
mozbuild = "0.1"
mozilla-central-workspace-hack = { version = "0.1", features = ["webnn_engine"], optional = true }
rustnn = { git = "https://github.com/padenot/rustnn", rev = "fa9dd965ce2b473e8a6a3ee91745ab774229e0bd", default-features = false, features = ["burn-cpu-runtime"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
rustnn = { git = "https://github.com/padenot/rustnn", rev = "fa9dd965ce2b473e8a6a3ee91745ab774229e0bd", default-features = false, features = ["coreml-runtime"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
rustnn = { git = "https://github.com/padenot/rustnn", rev = "fa9dd965ce2b473e8a6a3ee91745ab774229e0bd", default-features = false, features = ["trtx-runtime"] }

[lib]
path = "lib.rs"
crate-type = ["staticlib"]
