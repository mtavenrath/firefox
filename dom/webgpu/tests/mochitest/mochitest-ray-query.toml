[DEFAULT]
subsuite = "webgpu"
dupe-manifest = true
run-if = [
  "!verify",
]
prefs = [
  "dom.webgpu.enabled=true",
  "dom.webgpu.experimental-ray-query.enabled=true",
  "gfx.webgpu.ignore-blocklist=true",
]
scheme = "https"

["test_ray_query_demo.html"]
support-files = ["ray_query_triangle.mjs"]

["test_ray_query_policy.html"]

["test_ray_query_smoke.html"]
support-files = ["ray_query_smoke.js"]

["test_ray_query_validation.html"]

["test_ray_query_wasm.html"]
support-files = ["ray_query_smoke.js", "ray_query_wasm_worker.js", "firefox_ray_query_wasm.js", "firefox_ray_query_wasm_bg.wasm"]
